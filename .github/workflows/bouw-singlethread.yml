name: Bouw Whisper single-thread browserengine
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download openbare Whisper broncode
        run: git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git whisper
      - name: Prepareer niet-threaded build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('whisper')
          cm=root/'CMakeLists.txt'
          t=cm.read_text()
          for line in ('    set(CMAKE_C_FLAGS   "${CMAKE_C_FLAGS}   -pthread")\n','    set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -pthread")\n'):
              assert line in t, f'Upstream gewijzigd: {line}'
              t=t.replace(line,'')
          cm.write_text(t)
          cm=root/'examples/whisper.wasm/CMakeLists.txt'
          t=cm.read_text()
          assert '-s USE_PTHREADS=1' in t
          cm.write_text(t.replace('-s USE_PTHREADS=1','-s USE_PTHREADS=0'))
          src=root/'examples/whisper.wasm/emscripten.cpp'
          t=src.read_text()
          assert 'std::thread g_worker;' in t
          t=t.replace('#include <thread>','').replace('std::thread g_worker;','')
          block='''        if (g_worker.joinable()) {
            g_worker.join();
        }

'''
          assert t.count(block)==3
          t=t.replace(block,'')
          assert 'std::min(nthreads, std::min(16, mpow2(std::thread::hardware_concurrency())))' in t
          t=t.replace('std::min(nthreads, std::min(16, mpow2(std::thread::hardware_concurrency())))','1')
          t=t.replace('std::thread::hardware_concurrency()', '1')
          old='''            g_worker = std::thread([index, params, pcmf32 = std::move(pcmf32), is_multilingual]() {
                whisper_reset_timings(g_contexts[index]);
                whisper_full(g_contexts[index], params, pcmf32.data(), pcmf32.size());
                whisper_print_timings(g_contexts[index]);
                if (is_multilingual) {
                    free((void*)params.language);
                }
            });'''
          new='''            whisper_reset_timings(g_contexts[index]);
            whisper_full(g_contexts[index], params, pcmf32.data(), pcmf32.size());
            whisper_print_timings(g_contexts[index]);
            if (is_multilingual) {
                free((void*)params.language);
            }'''
          assert old in t
          src.write_text(t.replace(old,new))
          PY
      - name: Installeer compiler in tijdelijke GitHub runner (NIET op werk-pc)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
      - name: Compileer browserengine zonder pthreads
        run: |
          emcmake cmake -S whisper -B whisper/build-em -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_WASM_SINGLE_FILE=ON
          cmake --build whisper/build-em --target libmain -j 2
      - name: Lever enginebestand op
        uses: actions/upload-artifact@v4
        with:
          name: libmain-singlethread
          path: whisper/build-em/bin/libmain.js
