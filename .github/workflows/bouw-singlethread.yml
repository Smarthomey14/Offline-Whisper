name: Bouw Whisper single-thread browserengine
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download openbare Whisper broncode
        run: git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git whisper
      - name: Prepareer niet-threaded build
        run: |
          python3 scripts/patch.py
      - name: Installeer compiler in tijdelijke GitHub runner (NIET op werk-pc)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
      - name: Compileer browserengine zonder pthreads
        run: |
          emcmake cmake -S whisper -B whisper/build-em -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_WASM_SINGLE_FILE=ON
          cmake --build whisper/build-em --target libmain -j 2
      - name: Lever enginebestand op
        uses: actions/upload-artifact@v4
        with:
          name: libmain-singlethread
          path: whisper/build-em/bin/libmain.js
